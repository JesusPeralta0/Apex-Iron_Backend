spring.application.name=ecommerce

# Puerto del Tomcat
server.port=8080
# Recuerda colocar el nombre, usuario y contraseña que vayas a usar para la conexión a MySQL
# Cambiar el nombre de la bd: mydb -> apexiron
spring.datasource.url=jdbc:mysql://localhost:3306/mydb
# usuario
spring.datasource.username=root
# contraseña
spring.datasource.password=generation#

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# update crear/ajustar tablas, no crear la bd
spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Muestra el resultado SQL
spring.jpa.show-sql=true